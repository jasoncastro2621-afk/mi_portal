{% extends "base.html" %}

{% block title %}Página no encontrada | Jardín Escuela e Instituto Jesús Nazareno{% endblock %}

{% block content %}
  <div class="info-card fade-in visible text-center" style="max-width: 600px; margin: 3rem auto; border-top: 4px solid var(--accent-gold);">
    <div style="font-size: 4rem; color: var(--secondary-pink); margin-bottom: 0.5rem;">
      <i class="fa-solid fa-map-signs"></i>
    </div>
    <h2 style="color: var(--header-brown); border: none; padding: 0;">¡Ups! Página no encontrada</h2>
    <p style="color: var(--text-main); margin-top: 0.8rem;">
      La página que buscas no existe o fue movida. Regresemos a un lugar conocido:
    </p>
    <div style="margin-top: 1.5rem;">
      <a href="{{ url_for('inicio') }}" class="social-btn" style="text-decoration: none; padding: 0.8rem 1.6rem; border-radius: 8px; background-color: var(--header-blue); color: #fff; font-weight: 700; display: inline-flex; align-items: center; gap: 0.5rem;">
        <i class="fa-solid fa-house"></i> Volver al Inicio
      </a>
    </div>
  </div>
{% endblock %}
