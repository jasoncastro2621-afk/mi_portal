{% extends "base.html" %}

{% block title %}Publicar Noticia | Jardín Escuela e Instituto Jesús Nazareno{% endblock %}

{% block content %}
  <section class="page-header fade-in visible" style="text-align: center; margin-bottom: 2rem;">
    <h2 style="display: inline-block; border-bottom: 3px solid var(--accent-gold); padding-bottom: 0.5rem; color: var(--header-brown);">
      <i class="fa-solid fa-newspaper"></i> Publicar Noticia
    </h2>
    <p class="subtitle" style="color: var(--text-main); font-size: 1.05rem; margin-top: 0.5rem;">
      Página interna para agregar avisos y noticias al sitio.
    </p>
  </section>

  <div class="info-card fade-in visible" style="max-width: 700px; margin: 0 auto; border-top: 4px solid var(--accent-gold);">
    <form method="post" action="{{ url_for('nueva_noticia') }}" style="display: flex; flex-direction: column; gap: 1.1rem;">
      <div class="form-group" style="display: flex; flex-direction: column; gap: 0.4rem;">
        <label for="titulo" style="font-weight: 600; color: var(--header-brown); font-size: 0.95rem;">Título *</label>
        <input type="text" id="titulo" name="titulo" required
          style="padding: 0.75rem 1rem; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; outline: none;" />
      </div>

      <div class="form-group" style="display: flex; flex-direction: column; gap: 0.4rem;">
        <label for="contenido" style="font-weight: 600; color: var(--header-brown); font-size: 0.95rem;">Contenido *</label>
        <textarea id="contenido" name="contenido" rows="4" required
          style="padding: 0.75rem 1rem; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; outline: none; resize: vertical;"></textarea>
      </div>

      <button type="submit" style="width: 100%; padding: 0.85rem; background-color: var(--header-brown); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <i class="fa-solid fa-paper-plane"></i> Publicar
      </button>
    </form>
  </div>
{% endblock %}
